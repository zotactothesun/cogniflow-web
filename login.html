<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cogniflow - Developer Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Decorative background -->
    <div class="absolute w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[100px] top-[-20%] left-[-10%]"></div>
    <div class="absolute w-[600px] h-[600px] bg-purple-600/20 rounded-full blur-[100px] bottom-[-20%] right-[-10%]"></div>

    <div class="glass-panel p-10 rounded-2xl shadow-2xl w-full max-w-md relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Welcome Back</h1>
            <p class="text-slate-400">Sign in to the Cogniflow Developer Portal</p>
        </div>
        
        <form onsubmit="event.preventDefault(); document.getElementById('error').classList.remove('hidden');" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Work Email</label>
                <input type="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" placeholder="name@company.com">
            </div>
            <div>
                <div class="flex justify-between mb-2">
                    <label class="block text-sm font-medium text-slate-300">Password</label>
                    <a href="#" class="text-sm text-indigo-400 hover:text-indigo-300">Forgot password?</a>
                </div>
                <input type="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all" placeholder="••••••••">
            </div>
            
            <div id="error" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Authentication service is currently undergoing maintenance. Please try again later.
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-indigo-500/30">Sign In</button>
        </form>
        
        <div class="mt-6 text-center text-sm text-slate-400">
            Don't have an account? <a href="#" class="text-white hover:underline">Request Access</a>
        </div>
        
        <div class="mt-8 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-white transition-colors">&larr; Back to Homepage</a>
        </div>
    </div>
</body>
</html>
